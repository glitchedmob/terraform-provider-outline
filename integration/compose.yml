services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: outline
      POSTGRES_USER: outline
      POSTGRES_PASSWORD: acceptance-test-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outline -d outline"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  outline:
    image: docker.getoutline.com/outlinewiki/outline:${OUTLINE_VERSION:-1.10.1}
    ports:
      - "127.0.0.1:${OUTLINE_TEST_PORT:?test runner must choose a port}:3000"
    environment:
      NODE_ENV: production
      URL: http://127.0.0.1:${OUTLINE_TEST_PORT}
      PORT: "3000"
      DATABASE_URL: postgres://outline:acceptance-test-password@postgres:5432/outline
      PGSSLMODE: disable
      REDIS_URL: redis://redis:6379
      SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      UTILS_SECRET: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      FORCE_HTTPS: "false"
      FILE_STORAGE: local
      # Pagination fixtures create more than the API's ten groups per minute limit.
      RATE_LIMITER_ENABLED: "false"
    volumes:
      - outline-data:/var/lib/outline/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/_health | grep -q OK"]
      interval: 2s
      timeout: 5s
      start_period: 60s
      retries: 60

volumes:
  postgres-data:
  redis-data:
  outline-data:
